services:
  mysql:
    image: mysql:8
    container_name: voynich-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Never bind a container to a service's default port on the host —
      # it will eventually collide with a native install of that same
      # service (see mysqld already on host 3306 on some machines).
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - voynich-mysql-data:/var/lib/mysql
      # Supplies credentials to `docker exec ... mysql`/`mysqldump` via
      # option-file lookup instead of a `-p` argument, so the password
      # doesn't land in argv/shell history/session transcripts. Host file
      # must be chmod 600; not a cross-account isolation measure — see
      # scripts/mysql-backup.sh.
      - ${MYSQL_CNF_HOST_PATH}:/root/.my.cnf:ro

volumes:
  voynich-mysql-data:
